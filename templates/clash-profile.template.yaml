# claude-setup-kit — Clash Verge 本地配置模板（照参考机 2026-10-23 现状，节点全部换成占位符）
# 渲染：python3 scripts/render.py --component clash --nodes <你的节点参数.json>；或手工把双花括号占位符换成真实值。
# 导入 Clash Verge 后，把 templates/clash-profile.script.js 绑定为该配置的"脚本"（它写 DNS 并前置 STUN REJECT）。
# 分组：EXIT_GROUP 是 Claude 的固定出口（成员不许有 DIRECT）；GOOGLE_GROUP 只给 Google 系域名用，
#   成员是主出口以外的节点——Google 的地理库常把面向国内用户的机房 IP 判成中国，Gemini 会提示"不支持该地区"，
#   所以 Google 走另一个节点，Claude 的出口不动。两个分组的规则顺序：Claude 的 storage/fonts 精确规则在前，
#   Google 后缀规则其次，GEOSITE/GEOIP 兜底在后。
# rules 段含参考机的 112 条规则：其中监测/上报、CDN、第三方、进程兜底等 68 条来自 claude-client-full-reset 的
#   telemetry_routing.py（6 大模块），要更新以那边为准。
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 127.0.0.1:53
  ipv6: false
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - geosite:cn
  - geosite:private
  - +.lan
  - +.local
  - +.localhost
  - time.*.com
  - ntp.*.com
  - +.pool.ntp.org
  - '*.srv.nintendo.net'
  - stun.*.*
  respect-rules: false
  default-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  direct-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  nameserver:
  - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
  nameserver-policy:
    +.anthropic.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.claude.ai:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.claude.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.claude.app:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.claudeusercontent.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.claudemcpcontent.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.sentry.io:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.sentry-cdn.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.statsig.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.statsigapi.net:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.statsigcdn.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.featuregates.org:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.featureassets.org:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.assetsconfigcdn.org:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.prodregistryv2.org:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.beyondwickedmapping.org:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    http-intake.logs.us5.datadoghq.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    browser-intake-us5-datadoghq.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    cloudflare-dns.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    storage.googleapis.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    registry.npmjs.org:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    github.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    raw.githubusercontent.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    formulae.brew.sh:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    fonts.googleapis.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    fonts.gstatic.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    cdnjs.cloudflare.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    cdn.jsdelivr.net:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    cdn.tailwindcss.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    code.jquery.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    unpkg.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    geosite:cn:
    - https://223.5.5.5/dns-query#DIRECT
    geosite:private:
    - rcode://name_error
proxies:
- name: '{{NODE1_NAME}}'
  type: vless
  server: '{{NODE1_SERVER}}'
  port: {{NODE1_PORT}}
  uuid: '{{NODE1_UUID}}'
  network: tcp
  tls: true
  udp: true
  flow: xtls-rprx-vision
  servername: '{{NODE1_SNI}}'
  client-fingerprint: chrome
  reality-opts:
    public-key: '{{NODE1_REALITY_PUBLIC_KEY}}'
    short-id: '{{NODE1_REALITY_SHORT_ID}}'
- name: '{{NODE2_NAME}}'
  type: trojan
  server: '{{NODE2_SERVER}}'
  port: {{NODE2_PORT}}
  password: '{{NODE2_PASSWORD}}'
  sni: '{{NODE2_SNI}}'
  skip-cert-verify: false
  udp: true
- name: '{{NODE3_NAME}}'
  type: socks5
  server: '{{NODE3_SERVER}}'
  port: {{NODE3_PORT}}
  username: '{{NODE3_USERNAME}}'
  password: '{{NODE3_PASSWORD}}'
  udp: true
proxy-groups:
- name: '{{EXIT_GROUP}}'
  type: select
  proxies:
  - '{{NODE1_NAME}}'
  - '{{NODE2_NAME}}'
  - '{{NODE3_NAME}}'
- name: '{{GOOGLE_GROUP}}'
  type: select
  proxies:
  - '{{NODE2_NAME}}'
  - '{{NODE3_NAME}}'
- name: GLOBAL
  type: select
  hidden: true
  proxies:
  - '{{EXIT_GROUP}}'
