# claude-setup-kit — Clash Verge 本地配置模板（来自参考机 2026-10-22，节点全部换成占位符）
# 渲染：python3 scripts/render.py --component clash --nodes <你的节点参数.json>；或手工把双花括号占位符换成真实值。
# 导入 Clash Verge 后，把 templates/clash-profile.script.js 绑定为该配置的“脚本”（它写 DNS 并前置 STUN REJECT）。
# 不要给 {{EXIT_GROUP}} 分组加 DIRECT；国内走 GEOSITE/GEOIP CN DIRECT 由 rules 决定。
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 127.0.0.1:53
  ipv6: false
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - geosite:cn
  - geosite:private
  - +.lan
  - +.local
  - +.localhost
  - time.*.com
  - ntp.*.com
  - +.pool.ntp.org
  - '*.srv.nintendo.net'
  - stun.*.*
  respect-rules: false
  default-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  direct-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  nameserver:
  - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
  nameserver-policy:
    +.anthropic.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.claude.ai:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.claude.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.claude.app:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.claudeusercontent.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.claudemcpcontent.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.sentry.io:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.sentry-cdn.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.statsig.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.statsigapi.net:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.statsigcdn.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.featuregates.org:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.featureassets.org:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.assetsconfigcdn.org:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.prodregistryv2.org:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    +.beyondwickedmapping.org:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    http-intake.logs.us5.datadoghq.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    browser-intake-us5-datadoghq.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    cloudflare-dns.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    storage.googleapis.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    registry.npmjs.org:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    github.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    raw.githubusercontent.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    formulae.brew.sh:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    fonts.googleapis.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    fonts.gstatic.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    cdnjs.cloudflare.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    cdn.jsdelivr.net:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    cdn.tailwindcss.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    code.jquery.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    unpkg.com:
    - https://1.1.1.1/dns-query#{{EXIT_GROUP}}
    geosite:cn:
    - https://223.5.5.5/dns-query#DIRECT
    geosite:private:
    - rcode://name_error
proxies:
- name: '{{NODE1_NAME}}'
  type: vless
  server: '{{NODE1_SERVER}}'
  port: {{NODE1_PORT}}
  uuid: '{{NODE1_UUID}}'
  network: tcp
  tls: true
  udp: true
  flow: xtls-rprx-vision
  servername: '{{NODE1_SNI}}'
  client-fingerprint: chrome
  reality-opts:
    public-key: '{{NODE1_REALITY_PUBLIC_KEY}}'
    short-id: '{{NODE1_REALITY_SHORT_ID}}'
- name: '{{NODE2_NAME}}'
  type: trojan
  server: '{{NODE2_SERVER}}'
  port: {{NODE2_PORT}}
  password: '{{NODE2_PASSWORD}}'
  sni: '{{NODE2_SNI}}'
  skip-cert-verify: false
  udp: true
- name: '{{NODE3_NAME}}'
  type: socks5
  server: '{{NODE3_SERVER}}'
  port: {{NODE3_PORT}}
  username: '{{NODE3_USERNAME}}'
  password: '{{NODE3_PASSWORD}}'
  udp: true
proxy-groups:
- name: '{{EXIT_GROUP}}'
  type: select
  proxies:
  - '{{NODE1_NAME}}'
  - '{{NODE2_NAME}}'
  - '{{NODE3_NAME}}'
- name: GLOBAL
  type: select
  hidden: true
  proxies:
  - '{{EXIT_GROUP}}'
rules:
- DST-PORT,3478,REJECT
- DST-PORT,5349,REJECT
- DST-PORT,19302,REJECT
- DOMAIN-SUFFIX,anthropic.com,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,claude.ai,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,claude.com,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,claude.app,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,claudeusercontent.com,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,claudemcpcontent.com,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,sentry.io,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,sentry-cdn.com,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,statsig.com,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,statsigapi.net,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,statsigcdn.com,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,featuregates.org,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,featureassets.org,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,assetsconfigcdn.org,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,prodregistryv2.org,{{EXIT_GROUP}}
- DOMAIN-SUFFIX,beyondwickedmapping.org,{{EXIT_GROUP}}
- DOMAIN,http-intake.logs.us5.datadoghq.com,{{EXIT_GROUP}}
- DOMAIN,browser-intake-us5-datadoghq.com,{{EXIT_GROUP}}
- DOMAIN,cloudflare-dns.com,{{EXIT_GROUP}}
- DOMAIN,storage.googleapis.com,{{EXIT_GROUP}}
- DOMAIN,registry.npmjs.org,{{EXIT_GROUP}}
- DOMAIN,github.com,{{EXIT_GROUP}}
- DOMAIN,raw.githubusercontent.com,{{EXIT_GROUP}}
- DOMAIN,formulae.brew.sh,{{EXIT_GROUP}}
- DOMAIN,fonts.googleapis.com,{{EXIT_GROUP}}
- DOMAIN,fonts.gstatic.com,{{EXIT_GROUP}}
- DOMAIN,cdnjs.cloudflare.com,{{EXIT_GROUP}}
- DOMAIN,cdn.jsdelivr.net,{{EXIT_GROUP}}
- DOMAIN,cdn.tailwindcss.com,{{EXIT_GROUP}}
- DOMAIN,code.jquery.com,{{EXIT_GROUP}}
- DOMAIN,unpkg.com,{{EXIT_GROUP}}
- GEOSITE,private,DIRECT
- GEOIP,private,DIRECT,no-resolve
- GEOSITE,CN,DIRECT
- GEOSITE,geolocation-!cn,{{EXIT_GROUP}}
- GEOIP,CN,DIRECT
- MATCH,{{EXIT_GROUP}}
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
