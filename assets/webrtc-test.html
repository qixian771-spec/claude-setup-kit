<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>本地 WebRTC 防泄露测试</title>
<style>body{font:18px system-ui;background:#f6f8fb;color:#172b42;max-width:820px;margin:48px auto;padding:24px}section{background:white;border:1px solid #ddd;border-radius:16px;padding:24px;margin:20px 0}button{padding:12px 20px;font:inherit;border:0;border-radius:10px;background:#145ddd;color:white}input{font:inherit;padding:8px;width:16em}pre{white-space:pre-wrap;font:16px system-ui;line-height:1.8}.note{font-size:15px;color:#536474}.pass{color:#117a37}.fail{color:#b3261e}</style>
<h1>本地 WebRTC 防泄露测试</h1>
<p>结果只留在本页。不开摄像头、麦克风，不登录；STUN 服务器会收到测试连接（走代理）。</p>
<section>
<label>预期出口 IP（可选，填了会区分“代理出口”和“真实泄露”）：<input id="exit" placeholder="例如 203.0.113.7"></label><br><br>
<button id="start">重新测试</button>
<pre id="verdict"></pre><pre id="result">准备测试…</pre>
</section>
<p class="note">判定：候选里出现任何不等于预期出口的公网 IPv4/IPv6 = ❌ 泄露；只有 mDNS（.local）候选或没有候选 = ✅。没有候选也可能是浏览器禁用了 WebRTC，要结合 PF 的 STUN 计数一起看（manifest 的 pf.020）。</p>
<script>
function isPrivate(a){return /^(10\.|127\.|192\.168\.|169\.254\.|172\.(1[6-9]|2\d|3[01])\.|198\.18\.|198\.19\.)/.test(a)||/^(fe80:|fc|fd|::1$)/i.test(a);}
async function test(){
 const btn=document.querySelector('#start');btn.disabled=true;
 const output=document.querySelector('#result'),verdict=document.querySelector('#verdict');output.textContent='正在检查地址候选…';verdict.textContent='';
 const expected=document.querySelector('#exit').value.trim();
 const results={started_utc:new Date().toISOString(),expected_exit:expected||null,tests:[]};let leaks=[];
 for(const url of ['stun:stun.l.google.com:19302','stun:stun.cloudflare.com:3478']){
   let pc;const candidates=[];
   try{pc=new RTCPeerConnection({iceServers:[{urls:url}]});
     pc.onicecandidate=e=>{if(e.candidate)candidates.push(e.candidate.toJSON());};
     pc.createDataChannel('local-audit');
     await Promise.race([pc.setLocalDescription(await pc.createOffer()),new Promise((_,reject)=>setTimeout(()=>reject(new Error('offer_timeout')),7000))]);
     await new Promise(resolve=>{const timer=setTimeout(resolve,7000);pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete'){clearTimeout(timer);resolve();}};});
     const values=candidates.map(c=>({type:c.candidate.split(' typ ')[1]?.split(' ')[0],address:c.address||c.candidate.split(' ')[4]}));
     const literal=values.filter(c=>/^\d+\.\d+\.\d+\.\d+$/.test(c.address||'')||(c.address||'').includes(':'));
     const publicOnes=literal.filter(c=>!isPrivate(c.address));
     const bad=publicOnes.filter(c=>c.address!==expected);
     leaks=leaks.concat(bad.map(c=>c.address));
     results.tests.push({stun:url,complete:pc.iceGatheringState==='complete',candidate_count:values.length,srflx_count:values.filter(c=>c.type==='srflx').length,mdns_count:values.filter(c=>(c.address||'').endsWith('.local')).length,public_literal_count:publicOnes.length,leaked_addresses:bad.map(c=>c.address)});
   }catch(e){results.tests.push({stun:url,api_type:typeof RTCPeerConnection,error:e.name,detail:e.message});}finally{if(pc)pc.close();}
 }
 results.completed_utc=new Date().toISOString();
 results.verdict=leaks.length?'FAIL':'PASS';
 verdict.className=leaks.length?'fail':'pass';
 verdict.textContent=leaks.length?('❌ 泄露：候选里出现公网地址 '+[...new Set(leaks)].join(', ')):'✅ 未发现公网地址候选（只有 mDNS 或无候选）';
 output.textContent=JSON.stringify(results,null,2);
 btn.disabled=false;
}
document.querySelector('#start').onclick=test;test();
</script></html>
